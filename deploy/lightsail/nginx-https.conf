# This file is included inside nginx's http context by sites-enabled.
map $request_method $photo_calendar_login_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $photo_calendar_login_key zone=photo_calendar_login:1m rate=5r/m;

server {
    listen 80;
    server_name photo-calendar.15-165-115-190.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name photo-calendar.15-165-115-190.sslip.io;
    ssl_certificate /etc/letsencrypt/live/photo-calendar.15-165-115-190.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photo-calendar.15-165-115-190.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Spring's forwarded-header handling must only see headers set here.
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_read_timeout 90s;

    location = /api/auth/login {
        limit_req zone=photo_calendar_login burst=4 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @photo_calendar_login_limited;
        proxy_pass http://127.0.0.1:8080;
    }

    location @photo_calendar_login_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "12" always;
        return 429 '{"code":"LOGIN_RATE_LIMITED","message":"로그인 시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.","fieldErrors":[]}';
    }

    # Frontend releases are switched with the current symlink.
    root /var/www/photo-calendar/current;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
