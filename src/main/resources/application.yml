spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT}/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

photo:
  storage:
    enabled: ${PHOTO_STORAGE_ENABLED:false}
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${PHOTO_S3_BUCKET:}

  cleanup:
    enabled: ${PHOTO_CLEANUP_ENABLED:true}
    interval-ms: 300000

auth:
  owner:
    username: ${APP_LOGIN_USERNAME:owner}
    password-hash: ${APP_LOGIN_PASSWORD_HASH:}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
