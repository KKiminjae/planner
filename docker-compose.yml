services:
  mysql:
    image: mysql:8.4
    container_name: photo-calendar-mysql

    ports:
      - "${MYSQL_PORT}:3306"

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - photo_calendar_mysql_data:/var/lib/mysql

volumes:
  photo_calendar_mysql_data: